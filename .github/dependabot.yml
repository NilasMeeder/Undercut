version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2
