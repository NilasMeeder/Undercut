[project]
name = "f1dash-backend"
version = "0.1.0"
description = "FastF1-backed API for the F1 pitwall dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "fastf1>=3.8.3",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
