[project]
name = "f1dash-backend"
version = "0.1.0"
description = "FastF1-backed API for the F1 pitwall dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "fastf1>=3.8.3",
    "numpy>=2.5.4",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# Team radio as text (app/transcribe.py), optional: `uv sync --group transcribe` (make install
# does). MLX on Apple silicon, faster-whisper elsewhere; PyAV decodes the mp3s (no ffmpeg needed).
transcribe = [
    "av>=14.0.0",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
